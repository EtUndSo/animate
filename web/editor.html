<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>animate — Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css"/>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<!-- MathJax SVG output (fontCache:'none' inlines glyph <path>s) -> we vectorise them into VMobjects -->
<script>window.MathJax={svg:{fontCache:'none'},tex:{packages:{'[+]':['color']}},startup:{typeset:false}};</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>
<!-- apply the saved theme before first paint (NIGHT is the default) -> no flash -->
<script>try{if(localStorage.getItem("animate-theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
<style>
  /* NIGHT is the default (:root). Light theme via <html data-theme="light">. Palette follows dark-mode
     best practice: stepped, slightly blue-grey surfaces (not pure black), off-white text, one shared
     blue accent across both modes (Material/Radix/Tailwind-slate inspired). */
  /* Shared EtUndSo brand palette (science/tech): deep navy surfaces + a cyan/teal accent. Same tokens
     as the landing page so editor and site match. Night = default. */
  /* --s1/--s2/--s3 = stepped ELEVATION surfaces: deeper nesting = lighter (in dark mode). */
  :root{--bg:#0e1620;--panel:#15202e;--field:#1c2a3a;--sel:#243a52;--border:#273647;
        --s1:#1b2838;--s2:#26374d;--s3:#324863;
        --ink:#e6edf3;--muted:#93a4b5;--hint:#64748b;--accent:#4f9cff;--accent2:#22c3d6;--green:#3fb950;}
  :root[data-theme="light"]{--bg:#f4f7fb;--panel:#ffffff;--field:#ffffff;--sel:#e4eefb;--border:#dde4ec;
        --s1:#ffffff;--s2:#f1f5fb;--s3:#e8f0f9;
        --ink:#0f2033;--muted:#5a6b7b;--hint:#94a3b2;--accent:#1d6fe0;--accent2:#0d94a8;--green:#16a34a;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);}
  header{padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border);font-weight:600;display:flex;align-items:center;gap:16px;}
  header .brand{flex:none;}
  header .header-center{flex:1;display:flex;justify-content:center;gap:8px;}
  header .header-center button,header .header-center #load-lbl{color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;font:inherit;display:inline-block;}
  header .header-center #save-btn{background:var(--green);}                 /* Save = green  */
  header .header-center #load-lbl{background:#2f74d8;}                      /* Load = blue   */
  header .header-center #dl-png,header .header-center #dl-video{background:#e8820c;}  /* Photo + Video = orange */
  header .header-center button:hover,header .header-center #load-lbl:hover{filter:brightness(1.07);}
  header .header-center .export-split{position:relative;display:inline-flex;}
  header .header-center .export-split #dl-png,header .header-center .export-split #dl-video{border-radius:8px 0 0 8px;}
  header .header-center .export-caret{background:#d9760a;border-radius:0 8px 8px 0;padding:8px 9px;font-size:12px;}
  .export-menu{position:absolute;top:calc(100% + 4px);left:0;min-width:150px;background:var(--field);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.16);display:none;z-index:60;overflow:hidden;}
  .export-menu.open{display:block;}
  .export-item{padding:9px 13px;cursor:pointer;color:var(--ink);font-weight:600;font-size:14px;}
  .export-item:hover{background:rgba(127,127,127,.2);}
  header .tabs{display:flex;gap:4px;flex:none;}
  header .tabs button{border:1px solid var(--border);background:var(--field);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;}
  header .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  main{display:flex;flex-direction:column;gap:16px;padding:16px;}
  .preview{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .view-wrap{position:relative;width:min(100%,161vh);margin:0 auto;}
  #view{width:100%;aspect-ratio:16/9;border-radius:8px;display:block;border:1px solid #d0d5dd;background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 50%/24px 24px;}
  #editgizmo{position:absolute;left:0;top:0;width:100%;aspect-ratio:16/9;pointer-events:none;}
  #viewcube{position:absolute;top:10px;right:10px;width:104px;height:104px;cursor:pointer;touch-action:none;display:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.25));}
  #camgizmo{position:absolute;top:122px;right:10px;width:104px;height:133px;cursor:grab;touch-action:none;display:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.2));}
  #sum-overlay{position:absolute;top:18px;left:0;right:0;margin:0 auto;display:none;text-align:center;pointer-events:none;padding:0 18px;overflow:hidden;}
  #sum-overlay .katex{font-size:1.5em;}
  .panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .card h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  details.group>summary{cursor:pointer;font-weight:600;padding:6px 0;font-size:14px;}
  .palette-item{display:inline-block;margin:3px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--field);cursor:pointer;font-size:13px;}
  .palette-item:hover{border-color:var(--accent);color:var(--accent);}
  .obj-row{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:14px;}
  .obj-row.sel{background:var(--sel);}
  .obj-row .label{display:flex;align-items:center;gap:4px;min-width:0;}
  .obj-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .obj-row .caret{border:none;background:none;cursor:pointer;color:var(--muted);font-size:11px;width:14px;flex:none;padding:0;text-align:center;}
  .obj-row button{border:none;background:none;color:#ef4444;cursor:pointer;font-size:14px;}
  .prop{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;}
  .prop>label{width:76px;color:var(--muted);flex:none;}
  .prop input,.prop select{flex:1 1 0;min-width:0;padding:4px 6px;border:1px solid var(--border);border-radius:6px;font:inherit;background:var(--field);}
  .prop .vec{display:flex;gap:4px;flex:1;min-width:0;}
  .prop input[type=number]{-moz-appearance:textfield;}
  .prop input[type=number]::-webkit-inner-spin-button,.prop input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  .card{overflow:hidden;}
  .card select{width:100%;padding:7px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--field);cursor:pointer;}
  .render button{width:100%;background:var(--green);color:#fff;border:none;padding:10px;border-radius:10px;font-weight:600;cursor:pointer;font:inherit;}
  .preview-mode{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted);}
  .preview-mode select{padding:5px 8px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--field);cursor:pointer;}
  .preview-bar{display:flex;align-items:center;gap:12px;margin-top:8px;}
  .preview-bar button{border:1px solid var(--border);background:var(--field);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;}
  .preview-bar button:hover{border-color:var(--accent);color:var(--accent);}
  #status{font-size:13px;color:var(--muted);}
  .preview-bar .angle{margin-left:auto;font-size:13px;color:var(--muted);}
  .preview-bar select.angle{margin-left:6px;padding:4px 6px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--field);cursor:pointer;}
  .obj-row .ops{display:flex;gap:4px;align-items:center;}
  .obj-row .ops button{border:none;background:none;cursor:pointer;font-size:14px;color:var(--muted);padding:0;display:flex;align-items:center;}
  .obj-row .ops button.eye:hover{color:var(--accent);}
  .obj-row .ops button.del{color:#ef4444;}
  .hint{color:var(--hint);font-size:13px;}
  /* three big grouped boxes, each a different colour */
  .workspace{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start;}
  .bigbox{border:1px solid;border-radius:14px;padding:14px;overflow:hidden;}
  .bigbox>h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;}
  /* bigboxes = elevated surface (s1) with a coloured border + heading for identity (not a dark tint) */
  .box-add{background:var(--s1);border-color:rgba(91,155,255,.55);} .box-add>h2{color:#5b9bff;}
  .box-scene{background:var(--s1);border-color:rgba(53,196,106,.55);} .box-scene>h2{color:#35c46a;}
  .box-props{background:var(--s1);border-color:rgba(232,130,12,.6);} .box-props>h2{color:#e8820c;}
  .sub{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;overflow:hidden;}
  .sub .sub{background:var(--s3);}   /* deeper nesting -> lighter */
  .sub:last-child{margin-bottom:0;}
  .sub>h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .sub>select{width:100%;padding:7px;border:1px solid var(--border);border-radius:8px;font:inherit;background:var(--field);cursor:pointer;}
  .add-areas{display:flex;flex-wrap:wrap;gap:10px;}
  .add-areas>.sub{flex:1 1 220px;margin-bottom:0;}
  .anim-row.dragging{opacity:.45;}
  .anim-row.drop-target{box-shadow:inset 0 2px 0 var(--accent);}
  /* day/night SLIDE switch: a box slides left<->right; the exposed half is white (day) / black (night) */
  .theme-switch{position:relative;flex:none;width:56px;height:28px;border-radius:14px;border:1px solid var(--border);
                background:#000;cursor:pointer;padding:0;transition:background .18s;}
  .theme-switch .knob{position:absolute;top:2px;left:2px;width:25px;height:22px;border-radius:11px;background:var(--accent);
                      transform:translateX(26px);transition:transform .18s;}
  :root[data-theme="light"] .theme-switch{background:#fff;}
  :root[data-theme="light"] .theme-switch .knob{transform:translateX(0);}
  .theme-switch:hover{border-color:var(--accent);}
</style>
</head>
<body>
<header>
  <span class="brand">animate — Editor</span>
  <div class="header-center">
    <button id="save-btn">Save scene</button>
    <label id="load-lbl">Load scene<input id="load-input" type="file" accept=".json,application/json" hidden></label>
    <span class="export-split"><button id="dl-png">Photo</button><button id="dl-png-caret" class="export-caret" title="Format wählen">▾</button><div id="dl-png-menu" class="export-menu"></div></span>
    <span class="export-split"><button id="dl-video">Animation</button><button id="dl-video-caret" class="export-caret" title="Format wählen">▾</button><div id="dl-video-menu" class="export-menu"></div></span>
  </div>
  <button id="theme-toggle" class="theme-switch" title="Tag-/Nachtmodus umschalten"><span class="knob"></span></button>
  <div class="tabs">
    <button class="active">Editor</button>
    <button title="coming in Batch 5" disabled>Code</button>
    <button title="coming in Batch 5" disabled>Both</button>
  </div>
</header>
<main>
  <div class="preview">
    <div class="view-wrap">
      <canvas id="view" width="1920" height="1080"></canvas>
      <canvas id="editgizmo" width="1920" height="1080"></canvas>
      <canvas id="viewcube" width="156" height="156" title="Click a face to view the scene from that side"></canvas>
      <canvas id="camgizmo" width="156" height="200" title="Drag an axis to rotate the camera around it; drag the centre to orbit freely"></canvas>
      <div id="sum-overlay"></div>
    </div>
    <div class="preview-mode">
      <label for="play-mode">Animations:</label>
      <select id="play-mode">
        <option value="sequential">sequential</option>
        <option value="parallel">simultaneous</option>
      </select>
      <label for="view-mode" style="margin-left:16px">View:</label>
      <select id="view-mode">
        <option value="2d">2D</option>
        <option value="3d">3D (drag = rotate)</option>
      </select>
    </div>
    <div class="preview-bar">
      <button id="reset-btn" title="Reset to the edit view">⏮</button>
      <button id="play-btn">▶ Play</button>
      <button id="pause-btn" title="Pause">⏸</button>
      <button id="end-btn" title="Skip to end">⏭</button>
      <span id="status">Loading engine …</span>
      <label class="angle" for="domain-mode">Numbers:</label>
      <select id="domain-mode" class="angle">
        <option value="real">real</option>
        <option value="complex">complex (Re/Im)</option>
      </select>
      <label class="angle" for="angle-unit" style="margin-left:0">Angle:</label>
      <select id="angle-unit" class="angle">
        <option value="rad">radians (rad)</option>
        <option value="deg">degrees (°)</option>
      </select>
    </div>
  </div>
  <div class="workspace">
    <section class="bigbox box-add">
      <h2>Add Elements</h2>
      <div class="add-areas">
        <div class="sub"><h3>Templates</h3><select id="templates"></select></div>
        <div class="sub"><h3>Objects</h3><div id="palette"></div></div>
        <div class="sub"><h3>Operations</h3><div id="comp-palette"></div></div>
      </div>
    </section>
    <section class="bigbox box-scene">
      <h2>Scene</h2>
      <div class="sub"><h3>Objects</h3><div id="scene-objs"></div></div>
      <div class="sub"><h3>Animations</h3><div id="scene-anims"></div></div>
      <div class="sub"><h3>Operations</h3><div id="computations"></div></div>
    </section>
    <section class="bigbox box-props">
      <h2>Properties</h2>
      <div class="sub"><h3>Object</h3><div id="props"><span class="hint">No object selected.</span></div></div>
      <div class="sub"><h3>Operation</h3><div id="comp-props"><span class="hint">No operation selected.</span></div></div>
    </section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>
<!-- load with a per-load cache-buster so a new deploy is picked up immediately (no stale editor.js) -->
<script type="module">import("./editor.js?v=" + Date.now());</script>
</body>
</html>
