<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WebGL 3D-Prototyp — EtUndSo</title>
<style>
  :root{ --bg:#0d1017; --panel:#1a2130; --ink:#edf1f7; --muted:#99a4b8; --border:#27303f; --accent:#5c94ff; --accent2:#ff5e60; }
  *{box-sizing:border-box;} html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;}
  .bar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);}
  .bar h1{font-size:15px;margin:0 10px 0 0;font-weight:700;} .bar h1 b{color:var(--accent2);}
  .bar label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;}
  select,input[type=text]{background:#0f1420;color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;}
  input[type=text]{width:190px;} input[type=range]{accent-color:var(--accent);}
  .readout{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .readout b{color:var(--ink);}
  .wrap{position:relative;flex:1;min-height:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
  canvas:active{cursor:grabbing;}
  .hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--muted);background:rgba(13,16,23,.6);padding:6px 10px;border-radius:8px;pointer-events:none;}
  .err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--accent2);font-weight:600;}
</style>
</head>
<body>
  <div class="bar">
    <h1>WebGL&nbsp;<b>3D</b>-Prototyp</h1>
    <label>Funktion
      <select id="fn">
        <option value="sin(x)+cos(y)">sin(x)+cos(y)</option>
        <option value="exp(-(x*x+y*y)/6)">Gauß-Glocke e^(−(x²+y²)/6)</option>
        <option value="x*x-y*y">x²−y² (Sattel)</option>
        <option value="sin(sqrt(x*x+y*y))">sin(√(x²+y²)) (Wellen)</option>
        <option value="__custom">eigene …</option>
      </select>
    </label>
    <label id="customwrap" style="display:none">f(x,y)= <input id="custom" type="text" value="sin(x)*cos(y)"/></label>
    <label>Auflösung <input id="res" type="range" min="8" max="240" step="2" value="120"/> <span id="resv">120</span></label>
    <label><input id="height" type="checkbox"/> Höhenfarbe</label>
    <label>Bereich ±<input id="rng" type="range" min="2" max="12" step="1" value="6"/> <span id="rngv">6</span></label>
    <div class="readout" id="readout">—</div>
  </div>
  <div class="wrap">
    <canvas id="gl"></canvas>
    <div class="hint">Ziehen = drehen · Mausrad = zoomen</div>
    <div class="err" id="err"></div>
  </div>

<script>
"use strict";
// ---------- kleine mat4-Mathematik (Spalten-major, wie WebGL) ----------
function mul(a,b){ var o=new Float32Array(16);
  for(var c=0;c<4;c++)for(var r=0;r<4;r++){ var s=0; for(var k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k]; o[c*4+r]=s; } return o; }
function ortho(l,r,b,t,n,f){ return new Float32Array([2/(r-l),0,0,0, 0,2/(t-b),0,0, 0,0,-2/(f-n),0, -(r+l)/(r-l),-(t+b)/(t-b),-(f+n)/(f-n),1]); }
function sub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function norm(a){ var l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; }
function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function lookAt(eye,ctr,up){                       // view matrix (z-up world)
  var f=norm(sub(ctr,eye)), s=norm(cross(f,up)), u=cross(s,f);
  return new Float32Array([ s[0],u[0],-f[0],0, s[1],u[1],-f[1],0, s[2],u[2],-f[2],0,
    -dot(s,eye),-dot(u,eye),dot(f,eye),1 ]);
}

// ---------- WebGL-Setup ----------
var canvas=document.getElementById("gl"), errEl=document.getElementById("err");
var gl=canvas.getContext("webgl",{antialias:true,alpha:true});
if(!gl){ errEl.style.display="flex"; errEl.textContent="WebGL wird von diesem Browser nicht unterstützt."; throw new Error("no webgl"); }

var VS=`
attribute vec3 aPos; attribute vec3 aNormal; attribute float aZ;
uniform mat4 uProj, uView;
varying vec3 vNormal; varying vec3 vPos; varying float vZ;
void main(){ vNormal=aNormal; vPos=aPos; vZ=aZ; gl_Position=uProj*uView*vec4(aPos,1.0); }`;
var FS=`
precision highp float;
varying vec3 vNormal; varying vec3 vPos; varying float vZ;
uniform vec3 uBase; uniform vec3 uLightDir; uniform float uHeight;
vec3 heightCol(float t){                            // t in [0,1]: base->weiß oben, base->schwarz unten um 0.5
  vec3 b=uBase; return t>=0.5 ? mix(b,vec3(1.0),(t-0.5)*1.4) : mix(b,vec3(0.0),(0.5-t)*1.4); }
void main(){
  vec3 N=normalize(vNormal); if(!gl_FrontFacing) N=-N;        // beide Seiten beleuchten
  vec3 L=normalize(uLightDir);
  float diff=max(dot(N,L),0.0);
  float amb=0.35;
  vec3 col = (uHeight>0.5) ? heightCol(clamp(vZ,0.0,1.0)) : uBase;
  float shade = amb + (1.0-amb)*diff;
  // dezentes Specular für Plastizität
  vec3 V=vec3(0.0,0.0,1.0); vec3 H=normalize(L+V); float spec=pow(max(dot(N,H),0.0),24.0)*0.18;
  gl_FragColor=vec4(col*shade + spec, 1.0);
}`;
function sh(type,src){ var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
var prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog); if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
var loc={ pos:gl.getAttribLocation(prog,"aPos"), nrm:gl.getAttribLocation(prog,"aNormal"), z:gl.getAttribLocation(prog,"aZ"),
  proj:gl.getUniformLocation(prog,"uProj"), view:gl.getUniformLocation(prog,"uView"),
  base:gl.getUniformLocation(prog,"uBase"), light:gl.getUniformLocation(prog,"uLightDir"), height:gl.getUniformLocation(prog,"uHeight") };
var bPos=gl.createBuffer(), bNrm=gl.createBuffer(), bZ=gl.createBuffer(), bIdx=gl.createBuffer();
gl.enable(gl.DEPTH_TEST);

// ---------- Mesh: z=f(x,y) auf einem Gitter, skaliert in eine Box [-1,1]², z in [-0.6,0.6] ----------
var mesh={count:0, verts:0};
function buildMesh(f,n,rng){
  var t0=performance.now(), m=n+1, N=m*m;
  var X=new Float32Array(N), Y=new Float32Array(N), Z=new Float32Array(N);
  var zmin=Infinity,zmax=-Infinity, bad=false;
  for(var j=0;j<m;j++) for(var i=0;i<m;i++){
    var x=-rng+2*rng*i/n, y=-rng+2*rng*j/n, z=f(x,y);
    if(!isFinite(z)){ z=0; } var k=j*m+i; X[k]=x; Y[k]=y; Z[k]=z;
    if(z<zmin)zmin=z; if(z>zmax)zmax=z;
  }
  var zc=(zmin+zmax)/2, zh=Math.max((zmax-zmin)/2,1e-6);
  var pos=new Float32Array(N*3), zt=new Float32Array(N);
  for(var k2=0;k2<N;k2++){
    pos[k2*3]  = X[k2]/rng;                         // x,y -> [-1,1]
    pos[k2*3+1]= Y[k2]/rng;
    pos[k2*3+2]= 0.6*(Z[k2]-zc)/zh;                 // z -> [-0.6,0.6]
    zt[k2]=(Z[k2]-zmin)/(zmax-zmin+1e-9);           // 0..1 für Höhenfarbe
  }
  // Indizes (2 Dreiecke pro Zelle)
  var idx=new Uint16Array(n*n*6), p=0;
  for(var jj=0;jj<n;jj++) for(var ii=0;ii<n;ii++){
    var a=jj*m+ii, b=a+1, c=a+m, d=c+1;
    idx[p++]=a; idx[p++]=c; idx[p++]=b; idx[p++]=b; idx[p++]=c; idx[p++]=d;
  }
  // per-Vertex-Normalen: Flächennormalen akkumulieren -> glatt (der Kern von Smooth Shading)
  var nr=new Float32Array(N*3);
  for(var e=0;e<idx.length;e+=3){
    var i0=idx[e],i1=idx[e+1],i2=idx[e+2];
    var p0=[pos[i0*3],pos[i0*3+1],pos[i0*3+2]], p1=[pos[i1*3],pos[i1*3+1],pos[i1*3+2]], p2=[pos[i2*3],pos[i2*3+1],pos[i2*3+2]];
    var fn=cross(sub(p1,p0),sub(p2,p0));
    for(var vi=0;vi<3;vi++){ var ix=idx[e+vi]*3; nr[ix]+=fn[0]; nr[ix+1]+=fn[1]; nr[ix+2]+=fn[2]; }
  }
  for(var q=0;q<N;q++){ var l=Math.hypot(nr[q*3],nr[q*3+1],nr[q*3+2])||1; nr[q*3]/=l; nr[q*3+1]/=l; nr[q*3+2]/=l; }
  gl.bindBuffer(gl.ARRAY_BUFFER,bPos); gl.bufferData(gl.ARRAY_BUFFER,pos,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,bNrm); gl.bufferData(gl.ARRAY_BUFFER,nr,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,bZ);   gl.bufferData(gl.ARRAY_BUFFER,zt,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bIdx); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
  mesh.count=idx.length; mesh.verts=N; mesh.build=(performance.now()-t0);
}

// ---------- Kamera (z-up Orbit, orthographic — wie die Engine) ----------
var theta=0.7, phi=0.9, zoom=1.0;
function render(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=canvas.clientWidth*dpr, h=canvas.clientHeight*dpr;
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; }
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0.051,0.063,0.09,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  var ce=Math.cos(phi),se=Math.sin(phi),ct=Math.cos(theta),st=Math.sin(theta);
  var eye=[ce*ct*3,ce*st*3,se*3];                  // z-up: Kamera-Richtung wie in der Engine
  var view=lookAt(eye,[0,0,0],[0,0,1]);
  var asp=canvas.width/canvas.height, s=1.5/zoom;
  var proj=ortho(-s*asp,s*asp,-s,s,-10,10);
  var t0=performance.now();
  gl.useProgram(prog);
  gl.uniformMatrix4fv(loc.proj,false,proj); gl.uniformMatrix4fv(loc.view,false,view);
  gl.uniform3fv(loc.base,[0.18,0.42,0.95]); gl.uniform3fv(loc.light,norm([0.4,0.5,0.9]));
  gl.uniform1f(loc.height,document.getElementById("height").checked?1:0);
  gl.bindBuffer(gl.ARRAY_BUFFER,bPos); gl.enableVertexAttribArray(loc.pos); gl.vertexAttribPointer(loc.pos,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,bNrm); gl.enableVertexAttribArray(loc.nrm); gl.vertexAttribPointer(loc.nrm,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,bZ);   gl.enableVertexAttribArray(loc.z);   gl.vertexAttribPointer(loc.z,1,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bIdx);
  gl.drawElements(gl.TRIANGLES,mesh.count,gl.UNSIGNED_SHORT,0);
  var draw=performance.now()-t0;
  document.getElementById("readout").innerHTML=
    "<b>"+mesh.verts.toLocaleString("de-DE")+"</b> Vertices · Mesh "+mesh.build.toFixed(1)+" ms · Zeichnen <b>"+draw.toFixed(2)+" ms</b>";
}

// ---------- Funktion parsen + rebuild ----------
function makeF(expr){ try{ var f=new Function("x","y","with(Math){return ("+expr+");}"); f(1,1); return f; }catch(e){ return null; } }
function rebuild(){
  var sel=document.getElementById("fn").value;
  var expr = sel==="__custom" ? document.getElementById("custom").value : sel;
  document.getElementById("customwrap").style.display = sel==="__custom" ? "flex":"none";
  var f=makeF(expr);
  if(!f){ errEl.style.display="flex"; errEl.textContent="Ausdruck nicht auswertbar: "+expr; return; }
  errEl.style.display="none";
  var n=+document.getElementById("res").value, rng=+document.getElementById("rng").value;
  buildMesh(f,n,rng); render();
}

// ---------- Interaktion ----------
var drag=false,lx=0,ly=0;
canvas.addEventListener("pointerdown",function(e){ drag=true; lx=e.clientX; ly=e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove",function(e){ if(!drag)return; theta-=(e.clientX-lx)*0.01; phi=Math.max(-1.55,Math.min(1.55,phi+(e.clientY-ly)*0.01)); lx=e.clientX; ly=e.clientY; render(); });
canvas.addEventListener("pointerup",function(){ drag=false; });
canvas.addEventListener("wheel",function(e){ e.preventDefault(); zoom*=Math.exp(-e.deltaY*0.001); zoom=Math.max(0.3,Math.min(4,zoom)); render(); },{passive:false});
["fn","custom","height"].forEach(function(id){ document.getElementById(id).addEventListener("input",rebuild); });
document.getElementById("res").addEventListener("input",function(e){ document.getElementById("resv").textContent=e.target.value; rebuild(); });
document.getElementById("rng").addEventListener("input",function(e){ document.getElementById("rngv").textContent=e.target.value; rebuild(); });
window.addEventListener("resize",render);
rebuild();
</script>
</body>
</html>
